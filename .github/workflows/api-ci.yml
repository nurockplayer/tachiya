name: ci/api

on:
  pull_request:
    branches:
      - develop
      - master
    paths:
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/dependabot-automerge.yml"
      - ".github/workflows/weekly-release-pr.yml"
      - "api/**"
      - "docs/internal-api-contracts.md"
      - "docs/testing-and-ci-gates.md"
      - "docker-compose.yml"
      - "docker-compose.*.yml"
  push:
    branches:
      - develop
      - master
    paths:
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/dependabot-automerge.yml"
      - ".github/workflows/weekly-release-pr.yml"
      - "api/**"
      - "docs/internal-api-contracts.md"
      - "docs/testing-and-ci-gates.md"
      - "docker-compose.yml"
      - "docker-compose.*.yml"
  workflow_dispatch:

concurrency:
  group: ci-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff-check:
    name: Diff whitespace check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tachiya
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace errors
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            git diff --check "origin/${GITHUB_BASE_REF}"...HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

  api-test:
    name: API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout tachiya
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: uv sync --group dev

      - name: Run API tests
        run: uv run --group dev pytest

  api-compile:
    name: API compile check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout tachiya
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile API sources
        run: python -m compileall .

  api-image:
    name: API image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tachiya
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: tachiya-api:ci
          cache-from: type=gha,scope=tachiya-api
          cache-to: type=gha,scope=tachiya-api,mode=max
