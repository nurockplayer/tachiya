name: PR Scope Police

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scope-police:
    name: Scope police
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate PR scope
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            if (!pr) {
              core.setFailed('pull_request payload is required')
              return
            }

            const bypassLabels = new Set(['scope-exception'])
            const rawLabels = (pr.labels || []).map((label) => label.name)
            const bypassed = rawLabels.some((label) => bypassLabels.has(label))

            const owner = context.repo.owner
            const repo = context.repo.repo
            const hardMaxChangedFiles = 35
            const hardMaxDiffLines = 1000
            const warningDiffLines = 600
            const commentHeader = '<!-- tachiya-pr-scope-police -->'
            const autonomousLabels = new Set(['codex', 'codex-automation', 'auto-ready'])

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            })

            const filenames = files.map((file) => file.filename)
            const allFilePaths = files.flatMap((file) =>
              file.status === 'renamed' && file.previous_filename
                ? [file.filename, file.previous_filename]
                : [file.filename],
            )
            const diffLines = files.reduce((sum, file) => sum + file.additions + file.deletions, 0)
            const title = pr.title || ''
            const body = pr.body || ''
            const bodyForAutonomousGate = body.replace(/<!--[\s\S]*?-->/g, '')
            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const extractSectionBody = (label) => {
              const pattern = new RegExp(
                `(?:^|\\n)\\s*(?:-\\s*)?(?:#{1,6}\\s*)?${escapeRegExp(label)}\\s*[：:]\\s*([\\s\\S]*?)(?=\\n\\s*##\\s|\\n*$)`,
                'i',
              )
              const match = bodyForAutonomousGate.match(pattern)
              return match?.[1] ?? ''
            }
            const extractDelegationFieldBody = (label) => {
              const delegatedLabels = [
                'Source issue delegation plan',
                'Actual worker profile(s)',
                'Task',
                'Model strength',
                'Spawn directive',
                'Controller fallback reason',
                'Trivial/self-only exception reason',
                'Evidence / verification',
                'Spec gate evidence',
                'Final merge gate',
                'Worker session closeout',
                'Workflow friction / follow-up split',
                'Review conversation closeout',
              ]
              const pattern = new RegExp(
                `(?:^|\\n)\\s*-\\s*${escapeRegExp(label)}\\s*[：:]\\s*([\\s\\S]*?)(?=\\n\\s*-\\s*(?:${delegatedLabels
                  .map((value) => escapeRegExp(value))
                  .join('|')})\\s*[：:]|\\n\\s*##\\s|\\n*$)`,
                'i',
              )
              const match = bodyForAutonomousGate.match(pattern)
              return match?.[1] ?? ''
            }
            const normalizeSectionLine = (line) =>
              line
                .replace(/^\s*[-*]\s*/, '')
                .replace(/^[`"'“”‘’]+|[`"'“”‘’]+$/g, '')
                .replace(/[.,。:：;；!?！？]+$/g, '')
                .trim()
            const normalizePlaceholderValue = (value) =>
              value
                .trim()
                .replace(/[.,。:：;；!?！？]+$/g, '')
                .toLowerCase()
            const placeholderValues = new Set([
              'n/a',
              'none',
              '無',
              '不適用',
              'na',
              'n.a',
              'tbd',
              'todo',
              'pending',
              '-',
              '—',
              '待定',
              '尚未',
              '略',
              '略過',
              '待補',
            ])
            const isPlaceholderCloseoutLine = (line) => placeholderValues.has(normalizePlaceholderValue(line))
            const hasMeaningfulSectionLine = (line) =>
              !isPlaceholderCloseoutLine(line) && /[A-Za-z0-9\u4e00-\u9fff]/.test(line)
            const extractMeaningfulDelegationFieldLines = (label) =>
              extractDelegationFieldBody(label)
                .split('\n')
                .map(normalizeSectionLine)
                .filter(Boolean)
            const hasMeaningfulDelegationField = (label) =>
              extractMeaningfulDelegationFieldLines(label).some((line) => hasMeaningfulSectionLine(line))
            const pendingInitialGatePattern =
              /\b(?:pending|awaiting)\s+(?:initial|first)\s+(?:spec|merge|review|ci|gate|readback)\b|\binitial gate pending\b|待(?:補|跑|初次|首次).{0,8}(?:gate|讀回|驗證|證據)/i
            const isExplicitPendingInitialGate = (value) => pendingInitialGatePattern.test(value)
            const parseKeyValueLines = (lines) =>
              Object.fromEntries(
                lines
                  .map((line) => {
                    const match = line.match(/^([A-Za-z0-9_.-]+)\s*[=:]\s*(.+)$/)
                    if (!match) return null
                    return [match[1].trim().toLowerCase(), match[2].trim()]
                  })
                  .filter(Boolean),
              )
            const extractSpawnDirectives = () => {
              const spawnFieldPattern = /(?:^|\n)[^\S\n]*-[^\S\n]*(?:Spawn directive|spawn)[^\S\n]*[：:][^\S\n]*([^\n]+)/gi
              const spawnValuePattern = (key, line) => {
                const pattern = new RegExp(`${key}\\s*[=:]\\s*([^\\s]+)`, 'i')
                const match = line.match(pattern)
                return match?.[1]?.trim() ?? ''
              }
              const spawnFallbackReasonPattern = (line) => {
                const pattern = /fallback_reason\s*[=:]\s*(.+)/i
                const match = line.match(pattern)
                return match?.[1]?.trim() ?? ''
              }
              const parseSpawn = (line) => {
                const trimmed = line.trim()
                const profileMatch = trimmed.match(/^\s*profile\s*[=:]\s*([A-Za-z0-9_]+)\s/i)
                const profile = profileMatch?.[1] ?? trimmed.split(/\s+/)[0]
                const model = spawnValuePattern('model', trimmed)
                const reasoning = spawnValuePattern('reasoning', trimmed)
                const controllerFallback = spawnValuePattern('controller_fallback', trimmed)
                const fallbackReason = spawnFallbackReasonPattern(trimmed)
                return {
                  line: trimmed,
                  profile,
                  model,
                  reasoning,
                  controllerFallback,
                  fallbackReason,
                }
              }
              return [...bodyForAutonomousGate.matchAll(spawnFieldPattern)].map((match) => parseSpawn(match[1] || ''))
            }
            const spawnDirectives = extractSpawnDirectives()
            const hasSpawnDirective = spawnDirectives.length > 0
            const hasSpawnModel = spawnDirectives.some(
              (spawn) =>
                spawn.model &&
                !placeholderValues.has(normalizePlaceholderValue(spawn.model)) &&
                /^[A-Za-z0-9.\\-]+$/i.test(spawn.model),
            )
            const normalizedLabels = (pr.labels || []).map((label) => (label.name || '').toLowerCase())
            const hasAutonomousLabel = normalizedLabels.some((label) => autonomousLabels.has(label))
            const hasDelegationExecutionLog = /(?:^|\n)\s*(?:#{1,6}\s*)?Delegation Execution Log\b/i.test(bodyForAutonomousGate)
            const delegationExecutionLogLabels = [
              'Source issue delegation plan',
              'Actual worker profile(s)',
              'Task',
              'Model strength',
              'Spawn directive',
              'Controller fallback reason',
              'Spec gate evidence',
              'Final merge gate',
              'Trivial/self-only exception reason',
            ]
            const hasMeaningfulDelegationExecutionLog = delegationExecutionLogLabels.some((label) =>
              hasMeaningfulDelegationField(label),
            )
            const hasSpawnReasoning = spawnDirectives.some(
              (spawn) =>
                spawn.reasoning &&
                !placeholderValues.has(normalizePlaceholderValue(spawn.reasoning)) &&
                /^[A-Za-z0-9]+$/i.test(spawn.reasoning),
            )
            const hasSpawnControllerFallback = spawnDirectives.some(
              (spawn) =>
                spawn.controllerFallback &&
                ['not_allowed', 'allowed'].includes(normalizePlaceholderValue(spawn.controllerFallback)),
            )
            const hasSpawnDirectiveWithModelReasoning = spawnDirectives.length > 0 && spawnDirectives.every(
              (spawn) =>
                spawn.model &&
                !placeholderValues.has(normalizePlaceholderValue(spawn.model)) &&
                /^[A-Za-z0-9.\\-]+$/i.test(spawn.model) &&
                spawn.reasoning &&
                !placeholderValues.has(normalizePlaceholderValue(spawn.reasoning)) &&
                /^[A-Za-z0-9]+$/i.test(spawn.reasoning) &&
                ['not_allowed', 'allowed'].includes(normalizePlaceholderValue(spawn.controllerFallback)) &&
                (!/\bops_spark\b/i.test(spawn.line) || normalizePlaceholderValue(spawn.model) === 'gpt-5.3-codex-spark'),
            )
            const hasSpawnAllowedWithoutReason = spawnDirectives.some(
              (spawn) =>
                normalizePlaceholderValue(spawn.controllerFallback) === 'allowed' &&
                (!spawn.fallbackReason || isPlaceholderCloseoutLine(spawn.fallbackReason)),
            )
            const autonomousDetected = hasAutonomousLabel || hasMeaningfulDelegationExecutionLog
            const reviewConversationCloseoutBody = extractSectionBody('Review conversation closeout')
            const reviewConversationCloseoutLines = reviewConversationCloseoutBody
              .split('\n')
              .map(normalizeSectionLine)
              .filter(Boolean)
            const hasReviewConversationCloseout = reviewConversationCloseoutLines.length > 0
            const hasMeaningfulReviewConversationCloseout = reviewConversationCloseoutLines.some(
              (line) => !isPlaceholderCloseoutLine(line) && /[A-Za-z0-9\u4e00-\u9fff]/.test(line),
            )
            const workerProfileNames = [
              'controller',
              'ops_spark',
              'repo_scout',
              'docs_worker',
              'test_worker',
              'backend_worker',
              'frontend_worker',
              'schema_worker',
              'integration_worker',
              'review_worker',
            ]
            const hasWorkerProfileMention = workerProfileNames.some((profile) =>
              new RegExp(`\\b${profile.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i').test(bodyForAutonomousGate),
            )
            const hasOpsSparkMention = bodyForAutonomousGate.toLowerCase().includes('ops_spark')
            const trivialExceptionMatch = bodyForAutonomousGate.match(
              /(?:^|\n)\s*(?:#{1,6}\s*)?(?:Trivial(?:\s*\/\s*self-only)? exception reason|Self-only exception reason|Self-review\s*\/\s*exception reason)\s*[：:]\s*(.+)/i,
            )
            const trivialExceptionReason = trivialExceptionMatch?.[1]?.trim()
            const hasMeaningfulTrivialExceptionField = hasMeaningfulDelegationField('Trivial/self-only exception reason')
            const hasTrivialExceptionReason =
              hasMeaningfulTrivialExceptionField ||
              (Boolean(trivialExceptionReason) &&
                !placeholderValues.has(normalizePlaceholderValue(normalizeSectionLine(trivialExceptionReason))))
            const controllerFallbackReasonLines = extractMeaningfulDelegationFieldLines('Controller fallback reason')
            const hasControllerFallbackReasonField = controllerFallbackReasonLines.length > 0
            const hasMeaningfulControllerFallbackReason = controllerFallbackReasonLines.some((line) =>
              hasMeaningfulSectionLine(line),
            )
            const specGateEvidenceLines = extractMeaningfulDelegationFieldLines('Spec gate evidence')
            const hasSpecGateEvidence = specGateEvidenceLines.length > 0
            const hasMeaningfulSpecGateEvidence =
              specGateEvidenceLines.some((line) => hasMeaningfulSectionLine(line)) &&
              specGateEvidenceLines.some(
                (line) => hasMeaningfulSectionLine(line) || isExplicitPendingInitialGate(line),
              )
            const finalMergeGateLines = extractMeaningfulDelegationFieldLines('Final merge gate')
            const hasFinalMergeGate = finalMergeGateLines.length > 0
            const finalMergeGateHasExplicitPendingInitialGate = finalMergeGateLines.some((line) =>
              isExplicitPendingInitialGate(line),
            )
            const finalMergeGateKeyValues = parseKeyValueLines(finalMergeGateLines)
            const finalMergeGateRequiredKeys = [
              'latest_head_sha',
              'unresolved_thread_count',
              'spec_gate_status',
              'evidence_urls',
            ]
            const hasFinalMergeGateRequiredKeys = finalMergeGateRequiredKeys.every((key) => {
              const value = finalMergeGateKeyValues[key]
              return Boolean(value) && (hasMeaningfulSectionLine(value) || isExplicitPendingInitialGate(value))
            })
            const finalMergeGateReadyValue =
              finalMergeGateKeyValues.ready_to_merge ?? finalMergeGateKeyValues.merge_ready ?? ''
            const finalMergeGateReadyFlag = !finalMergeGateReadyValue
              ? 'absent'
              : /^true$/i.test(finalMergeGateReadyValue)
                ? 'true'
                : /^false$/i.test(finalMergeGateReadyValue)
                  ? 'false'
                  : 'other'
            const finalMergeGateReadyWithResolvedThreadsOnly =
              finalMergeGateReadyFlag !== 'true' ||
              (/^0$/i.test(finalMergeGateKeyValues.unresolved_thread_count ?? '') &&
                !finalMergeGateHasExplicitPendingInitialGate)
            const hasMeaningfulFinalMergeGate =
              finalMergeGateLines.some((line) => hasMeaningfulSectionLine(line)) &&
              (finalMergeGateHasExplicitPendingInitialGate || hasFinalMergeGateRequiredKeys) &&
              finalMergeGateReadyWithResolvedThreadsOnly
            const routineOpsKeywords = [
              'readback',
              'ci status',
              'check status',
              'review closeout',
              'review conversation closeout',
              'closeout evidence',
              'commit',
              'push',
              'pre-commit',
              'post-push',
              'head sha',
              'branch',
              'pr body',
              'pr comment',
              'issue comment',
              'thread',
              'resolve',
              'resolved',
              '讀回',
              '狀態讀回',
              '留言',
              '證據',
              '收斂',
              '關閉對話',
            ]
            const hasRoutineOpsWork = routineOpsKeywords.some((keyword) =>
              bodyForAutonomousGate.toLowerCase().includes(keyword.toLowerCase()),
            )

            const allowedPrefixes = ['[backend]', '[frontend]', '[discussion]']
            const titlePrefix = allowedPrefixes.find((prefix) => title.startsWith(prefix))
            const hasSourceOfTruth = /(?:^|\n)\s*-?\s*Source of truth\s*[：:]/i.test(body)
            const hasExplicitNonGoals = body.includes('本 PR 明確不做')
            const dependsOnMatch = body.match(/(?:^|\n)\s*-?\s*Depends on PR\s*[：:]\s*(.+)/i)
            const dependsOnRaw = dependsOnMatch?.[1]?.trim()
            const dependsOnNone = dependsOnRaw?.toLowerCase() === 'none'
            const dependsOnPrMatch = dependsOnRaw?.match(/^#(\d+)$/)

            const isDocsOrMetadataPath = (name) =>
              name.startsWith('docs/') ||
              name.startsWith('.github/ISSUE_TEMPLATE/') ||
              name === '.github/PULL_REQUEST_TEMPLATE.md' ||
              name === 'AGENTS.md' ||
              name === 'README.md' ||
              /^[^/]+\.md$/i.test(name)

            const touches = {
              api: allFilePaths.some((name) => name.startsWith('api/')),
              dashboard: allFilePaths.some((name) => name.startsWith('dashboard/')),
              workflow: allFilePaths.some((name) => name.startsWith('.github/workflows/')),
              docs: allFilePaths.some(isDocsOrMetadataPath),
              rootConfig: allFilePaths.some((name) =>
                ['Makefile', 'docker-compose.yml', '.gitignore', '.gitattributes'].includes(name) ||
                /^docker-compose\..+\.ya?ml$/.test(name),
              ),
            }

            const productSurfaces = Object.entries({
              api: touches.api,
              dashboard: touches.dashboard,
            })
              .filter(([, touched]) => touched)
              .map(([name]) => name)

            const failures = []
            const warnings = []

            if (bypassed) {
              core.notice('Scope checks bypassed by scope-exception label; autonomous delegation gate still enforced.')
            }

            if (!bypassed && !titlePrefix) {
              failures.push(`PR title must start with one of: ${allowedPrefixes.join(', ')}. Current title: "${title}".`)
            }

            if (!bypassed && !/#\d+/.test(body)) {
              failures.push('PR body must reference at least one issue or PR number such as `#123`.')
            }

            if (!bypassed && !hasSourceOfTruth) {
              failures.push('PR body must include a `Source of truth` line.')
            }

            if (!bypassed && !dependsOnRaw) {
              failures.push('PR body must include a `Depends on PR` line with `none` or `#123`.')
            } else if (!bypassed && !dependsOnNone && !dependsOnPrMatch) {
              failures.push('`Depends on PR` must be `none` or a single PR number such as `#123`.')
            }

            if (!bypassed && !hasExplicitNonGoals) {
              failures.push('PR body must include a `本 PR 明確不做` section.')
            }

            if (autonomousDetected) {
              if (!hasDelegationExecutionLog) {
                failures.push('Autonomous PRs must include a `Delegation Execution Log` section.')
              }

              if (!hasWorkerProfileMention && !hasTrivialExceptionReason) {
                failures.push(
                  'Autonomous PRs must name at least one worker profile or give an explicit trivial/self-only exception reason.',
                )
              }

              if (!hasMeaningfulSpecGateEvidence) {
                failures.push('Autonomous PRs must include a meaningful `Spec gate evidence` field.')
              }

              if (!hasMeaningfulFinalMergeGate) {
                failures.push('Autonomous PRs must include a meaningful `Final merge gate` field.')
              }

              if (!finalMergeGateReadyWithResolvedThreadsOnly) {
                failures.push(
                  'Autonomous PRs with `ready_to_merge=true` or `merge_ready=true` must set `unresolved_thread_count=0` and remove pending initial gate placeholders.',
                )
              }

              if (!hasMeaningfulReviewConversationCloseout) {
                failures.push('Autonomous PRs must include a meaningful `Review conversation closeout` field.')
              }

              if (!hasTrivialExceptionReason && hasDelegationExecutionLog && !hasSpawnDirectiveWithModelReasoning) {
                failures.push(
                  'Autonomous PRs with worker delegation must include a Spawn directive with `model=` and `reasoning=`.',
                )
              }

              if (hasSpawnAllowedWithoutReason) {
                failures.push('Autonomous PRs with `controller_fallback=allowed` must include `fallback_reason=`.')
              }

              if (hasRoutineOpsWork && !hasOpsSparkMention && !hasTrivialExceptionReason) {
                warnings.push(
                  'Autonomous PRs with routine readback/comment/closeout or commit-push checklist work should delegate that slice to `ops_spark` or document a trivial/self-only exception.',
                )
              }
            }

            if (!bypassed && filenames.length > hardMaxChangedFiles) {
              failures.push(`PR changes ${filenames.length} files, which exceeds the hard limit of ${hardMaxChangedFiles}.`)
            }

            if (!bypassed && diffLines > hardMaxDiffLines) {
              failures.push(`PR diff size is ${diffLines} lines (+/-), which exceeds the hard limit of ${hardMaxDiffLines}.`)
            } else if (!bypassed && diffLines > warningDiffLines) {
              warnings.push(`PR diff size is ${diffLines} lines (+/-), which exceeds the soft limit of ${warningDiffLines}.`)
            }

            if (!bypassed && productSurfaces.length > 1) {
              failures.push(`PR touches multiple product surfaces (${productSurfaces.join(', ')}). Split API and dashboard work.`)
            }

            if (!bypassed && titlePrefix === '[backend]' && touches.dashboard) {
              failures.push('[backend] PR must not change dashboard surfaces.')
            }

            if (!bypassed && titlePrefix === '[frontend]' && touches.api) {
              failures.push('[frontend] PR must not change API/backend surfaces.')
            }

            const summaryLines = [
              commentHeader,
              '## PR Scope Police',
              '',
              failures.length === 0
                ? '- PASS: scope checks passed.'
                : '- FAIL: this PR is blocked by policy or scope issues.',
            ]

            if (failures.length > 0) {
              summaryLines.push('')
              summaryLines.push('### Issues')
              for (const failure of failures) {
                summaryLines.push(`- ${failure}`)
              }
            }

            if (warnings.length > 0) {
              summaryLines.push('')
              summaryLines.push('### Warnings')
              for (const warning of warnings) {
                summaryLines.push(`- ${warning}`)
              }
            }

            summaryLines.push('')
            summaryLines.push('### Snapshot')
            summaryLines.push(`- Changed files: ${filenames.length}`)
            summaryLines.push(`- Diff lines (+/-): ${diffLines}`)
            summaryLines.push(`- Product surfaces: ${productSurfaces.length > 0 ? productSurfaces.join(', ') : 'none'}`)
            summaryLines.push(`- Workflow touched: ${touches.workflow ? 'yes' : 'no'}`)
            summaryLines.push(`- Autonomous label hit: ${hasAutonomousLabel ? 'yes' : 'no'}`)
            summaryLines.push(`- Delegation log present: ${hasDelegationExecutionLog ? 'yes' : 'no'}`)
            summaryLines.push(`- Delegation log meaningful: ${hasMeaningfulDelegationExecutionLog ? 'yes' : 'no'}`)
            summaryLines.push(`- Spawn directive count: ${spawnDirectives.length}`)
            summaryLines.push(`- Spawn model present: ${hasSpawnModel ? 'yes' : 'no'}`)
            summaryLines.push(`- Spawn reasoning present: ${hasSpawnReasoning ? 'yes' : 'no'}`)
            summaryLines.push(`- Spawn controller_fallback present: ${hasSpawnControllerFallback ? 'yes' : 'no'}`)
            summaryLines.push(
              `- Controller fallback reason: ${!hasControllerFallbackReasonField ? 'missing' : hasMeaningfulControllerFallbackReason ? 'meaningful' : 'placeholder'}`,
            )
            summaryLines.push(`- Routine ops delegation hint: ${hasRoutineOpsWork && !hasOpsSparkMention && !hasTrivialExceptionReason ? 'missing ops_spark' : 'ok'}`)
            summaryLines.push(
              `- Spec gate evidence: ${!hasSpecGateEvidence ? 'missing' : hasMeaningfulSpecGateEvidence ? 'meaningful' : 'placeholder'}`,
            )
            summaryLines.push(
              `- Final merge gate: ${!hasFinalMergeGate ? 'missing' : hasMeaningfulFinalMergeGate ? 'meaningful' : 'invalid'}`,
            )
            summaryLines.push(`- Final merge gate required keys: ${hasFinalMergeGateRequiredKeys ? 'present' : 'missing'}`)
            summaryLines.push(`- Final merge gate ready flag: ${finalMergeGateReadyFlag}`)
            summaryLines.push(
              `- Final merge gate pending-initial-gate marker: ${finalMergeGateHasExplicitPendingInitialGate ? 'yes' : 'no'}`,
            )
            summaryLines.push(
              `- Final merge gate ready-thread rule: ${finalMergeGateReadyWithResolvedThreadsOnly ? 'ok' : 'blocked'}`,
            )
            summaryLines.push(`- Review conversation closeout present: ${hasReviewConversationCloseout ? 'yes' : 'no'}`)
            summaryLines.push(`- Review conversation closeout meaningful: ${hasMeaningfulReviewConversationCloseout ? 'yes' : 'no'}`)
            summaryLines.push('- Bypass label: `scope-exception`')

            const commentBody = summaryLines.join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            })
            const previous = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(commentHeader),
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body: commentBody,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: commentBody,
              })
            }

            if (failures.length > 0) {
              core.setFailed('PR Scope Police blocked this PR. See sticky comment for details.')
            } else {
              core.notice('PR scope police passed.')
            }
