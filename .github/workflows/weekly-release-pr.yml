name: Weekly Release PR

on:
  schedule:
    # Saturday 10:00 Asia/Taipei = Saturday 02:00 UTC.
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  create-release-pr:
    name: Create develop to master PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tachiya
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if develop is ahead of master
        id: check
        run: |
          git fetch origin master develop
          commits_ahead=$(git rev-list --count origin/master..origin/develop)
          echo "commits_ahead=$commits_ahead" >> "$GITHUB_OUTPUT"
          echo "develop is $commits_ahead commits ahead of master"

      - name: Skip if nothing to release
        if: steps.check.outputs.commits_ahead == '0'
        run: echo "develop is up to date with master, skipping."

      - name: Check for existing open release PR
        if: steps.check.outputs.commits_ahead != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base master --head develop --state open --json number --jq '.[0].number // ""')
          echo "existing_pr=$existing" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then
            echo "Release PR #$existing already open, skipping."
          fi

      - name: Create release PR
        if: steps.check.outputs.commits_ahead != '0' && steps.existing.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date_stamp=$(TZ=Asia/Taipei date +%Y-%m-%d)
          commits_ahead=${{ steps.check.outputs.commits_ahead }}
          cat > /tmp/release-pr-body.md <<EOF
          ## Weekly Release — $date_stamp

          Auto-generated by weekly-release-pr workflow.

          **Commits ahead:** $commits_ahead

          ## Scope 對齊

          - Source of truth: develop release promotion on $date_stamp.
          - Depends on PR: none

          ## 本 PR 明確不做

          - 不新增任何程式碼變更，僅將 develop promote 到 master。
          - 不修改任何未在 develop 上的內容。

          ## Checklist

          - [ ] CI 通過
          - [ ] 確認無 half-finished feature
          - [ ] Merge

          > Note: scheduled workflows require this file to exist on the repository default branch before the schedule becomes active.
          EOF
          gh pr create \
            --base master \
            --head develop \
            --title "[release] develop to master ($date_stamp)" \
            --body-file /tmp/release-pr-body.md

      - name: Dispatch API CI against develop
        if: steps.check.outputs.commits_ahead != '0' && steps.existing.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run api-ci.yml --ref develop
