[project]
name = "tachiya-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",        # Saleor GraphQL 呼叫
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=config",
    "--cov=database",
    "--cov=main",
    "--cov=models",
    "--cov=routers",
    "--cov=security",
    "--cov=services",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
